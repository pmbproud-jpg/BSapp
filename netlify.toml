[build]
  command = "npx expo export --platform web"
  publish = "dist"
  functions = "netlify/functions"

[build.environment]
  # Node 20+ wymagane przez RN 0.81 / Expo SDK 54 / Metro 0.83 / @supabase/supabase-js@2.94
  # (Array.prototype.toReversed to ES2023, dostepne od Node 20)
  NODE_VERSION = "20"
  # UWAGA: env vars dla SUPABASE wczytywane z Netlify Dashboard ->
  # Site settings -> Environment variables. NIE hardcodowac tutaj
  # bo: (a) klucz wpada do bundla po rotacji = uniewazniony klucz
  # zostaje na produkcji, (b) toml jest commitowany do git -- secret leak.
  # Konfigurowane w Dashboard: EXPO_PUBLIC_SUPABASE_URL,
  # EXPO_PUBLIC_SUPABASE_ANON_KEY, EXPO_PUBLIC_SITE_URL,
  # SUPABASE_SERVICE_ROLE_KEY (bez prefiksu EXPO_PUBLIC_),
  # SUPABASE_URL i SUPABASE_ANON_KEY (dla Netlify Functions).

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
  force = false
